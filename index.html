<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICMR 2026 Proceedings Flipbook</title>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Page-Flip Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e5e5e5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .flipbook-container {
      position: relative;
      width: 90vw;
      height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flipbook {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .page {
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #ccc;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 24px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .nav-btn:hover {
      background: #ffffff;
      transform: translateY(-50%) scale(1.1);
    }

    #prev-btn { left: 15px; }
    #next-btn { right: 15px; }

    #loading {
      position: absolute;
      font-weight: bold;
      color: #555;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="flipbook-container">
    <button id="prev-btn" class="nav-btn">&#10094;</button>
    <div id="loading">Loading ICMR 2026 Proceedings...</div>
    <div id="flipbook"></div>
    <button id="next-btn" class="nav-btn">&#10095;</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Updated to target your specific PDF filename
    const PDF_URL = 'icmr2026-proceedings.pdf';

    async function initFlipbook() {
      const flipbookEl = document.getElementById('flipbook');
      const loadingEl = document.getElementById('loading');

      try {
        const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
        loadingEl.style.display = 'none';

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          pageDiv.appendChild(canvas);
          flipbookEl.appendChild(pageDiv);

          await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        const pageFlip = new St.PageFlip(flipbookEl, {
          width: 550,
          height: 730,
          size: 'stretch',
          minWidth: 300,
          maxWidth: 900,
          minHeight: 400,
          maxHeight: 1200,
          maxShadowOpacity: 0.4,
          showCover: true,
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
        document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());

      } catch (error) {
        loadingEl.innerText = 'Error loading icmr2026-proceedings.pdf. Ensure the file is in the root directory.';
        console.error(error);
      }
    }

    window.addEventListener('DOMContentLoaded', initFlipbook);
  </script>
</body>
</html>
