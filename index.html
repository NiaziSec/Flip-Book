<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark-Free Publication Viewer</title>

    <!-- Core Open-Source Scripts via Fast Delivery CDN -->
    <script src="https://jquery.com"></script>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://jsdelivr.net">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #2c3e50;
            overflow: hidden;
        }
        #viewer-container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="viewer-container">
        <!-- 
          The script parses the local filename directly. 
          Make sure "book.pdf" matches your exact filename.
        -->
        <div class="_df_book" 
             source="book.pdf" 
             id="clean_viewer"
             webgl="true"
             backgroundcolor="#2c3e50">
        </div>
    </div>

</body>
</html>
